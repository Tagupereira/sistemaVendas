<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport" />
    <meta name="theme-color" content="#3b82f6">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Pendentes</title>
</head>

<body class="bg-slate-50">

    <!-- Header -->
    <header class="relative h-20 mb-10 overflow-hidden">

        <svg viewBox="0 0 10 100" preserveAspectRatio="none" class="absolute inset-0 w-full h-full">

            <path id="temaTopo" d="M0,0 L500,0 L500,130 C350,220 150,40 0,130 Z"></path>

        </svg>

        <div class="relative z-10 px-6 pt-6 flex gap-4 items-center">
            <span id="back" class="material-symbols-outlined text-3xl text-white">keyboard_return</span>

            <h1 id="tituloPage" class="text-2xl font-semibold text-white">Pendentes</h1>
            <div id="indResp" class="w-[15px] h-[15px] bg-blue-300 rounded-full ml-auto"></div>
        </div>

    </header>

    <main class="px-5 -mt-4 pb-10">

        <!-- BUSCA -->

        <div class="bg-white rounded-3xl shadow p-5 ">

            <input id="buscarVenda" type="text" placeholder="Buscar pendencia ou cliente..."
                class="w-full border-b-2 border-slate-200 py-3 outline-none focus:border-blue-500">

        </div>

        <!-- LISTA -->

        <div id="listaPendencias" class="space-y-3 mt-5">

            <!-- CARDS INSERIDOS VIA JS -->

            <div id="listaVendas" class="space-y-6">

            </div>

        </div>

    </main>
    <!-- MODAL PENDENCIAS POR CLIENTE -->
     <div id="modalPendencia" class="fixed inset-0 bg-black/40 hidden flex items-end z-50">
        <div class="bg-white w-full h-full p-6 animate-slide-up">
            
            <div class="flex justify-between">
                <h2 class="text-2xl font-bold mb-5">Pendências</h2>
                <span id="closePend" class="material-symbols-outlined text-3xl">close</span>
            </div>
                
            <div id="content" class="max-h-[82vh] overflow-y-auto p-2"></div>
            
            <div id="total">
                <div class="flex justify-between mt-8">
                    <span class="font-bold text-2xl">Total pendente:</span>
                    <span id="totalPend" class="font-bold text-2xl text-red-500">R$ 0,00</span>
                </div>
            </div>
        </div>
     </div>

    <!-- MODAL RECEBER -->

    <div id="modalReceber" class="fixed inset-0 bg-black/40 hidden flex items-end z-50">

        <div class="bg-white w-full rounded-t-[35px] p-6 animate-slide-up">

            <div class="w-20 h-1 bg-slate-300 mx-auto mb-5 rounded-full"></div>
            
            <h2 class="text-2xl font-bold mb-5">
                Receber Pagamento
            </h2>

            <div class="space-y-4">
                <div>
                    <label class="text-slate-500">

                        Cliente

                    </label>

                    <input id="clienteReceber" disabled class="w-full border-b py-2 bg-transparent">

                </div>

                <div>

                    <label class="text-slate-500">

                        Saldo Atual

                    </label>

                    <input id="saldoReceber" disabled class="w-full border-b py-2 bg-transparent">

                </div>

                <div>

                    <label>

                        Valor Recebido

                    </label>

                    <input id="valorRecebido" type="number" step="0.01" class="w-full border-b py-3 outline-none ">

                </div>

                <div>

                    <label>

                        Forma Pagamento

                    </label>

                    <select id="formaRecebimento" class="w-full border-b py-3 outline-none">

                    </select>

                </div>

                <div id="novoSaldo" class="text-red-500 font-bold">

                </div>

                <div class="flex gap-3 mt-8 ">

                    <button id="cancelarRecebimento" class="flex-1 bg-slate-200 rounded-2xl p-4">

                        Cancelar

                    </button>

                    <button id="confirmarRecebimento" class="flex-1 text-white rounded-2xl p-4">

                        Receber

                    </button>

                </div>

            </div>

        </div>

    </div>

    <div id="loadingOverlay"
        class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center">

        <div class="bg-white p-6 rounded-2xl shadow-lg flex items-center gap-3">

            <div class="w-6 h-6 border-4 border-blue-500 border-t-transparent rounded-full animate-spin">
            </div>

            <span>
                Registrando recebimento...
            </span>

        </div>

    </div>
    
    <script type="module" src="./js/pages/pendentes.page.js"></script>

</body>

</html>
