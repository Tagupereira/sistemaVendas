<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Produtos</title>
</head>

<body class="bg-slate-50">

    <!-- Header -->
    <header class="relative h-20 mb-10 overflow-hidden">

        <svg viewBox="0 0 10 100" preserveAspectRatio="none" class="absolute inset-0 w-full h-full">

            <path id="temaTopo" d="M0,0 L500,0 L500,130 C350,220 150,40 0,130 Z"></path>

        </svg>

        <div class="relative z-10 px-6 pt-6 flex gap-4 items-center">
            <span id="back" class="material-symbols-outlined text-3xl text-white">keyboard_return</span>

            <h1 class="text-2xl font-semibold text-white">Configurações</h1>
            <div id="indResp" class="w-[15px] h-[15px] bg-blue-300 rounded-full ml-auto"></div>
        </div>

    </header>

    <main class="px-5 -mt-4">

        <!-- <div class="min-h-screen bg-gray-50"> -->
        <div class="bg-gray-50">

            <div class="bg-white p-4 shadow">

                <p class="text-gray-500 mt-1">
                    Personalize o comportamento do sistema

                </p>

            </div>

            <div class="mt-5 space-y-2">
                <div class="bg-white rounded-2xl shadow p-5">
                    <div class="flex justify-between items-center">
                        <div>

                            <h3 class="font-semibold text-xl">
                                Modo Evento

                            </h3>

                            <p class="text-gray-500 text-sm mt-1">
                                Ativa impressão de senha do pedido

                            </p>

                        </div>

                        <label class="relative inline-flex cursor-pointer">

                            <input id="modoEvento" type="checkbox" class="sr-only peer" />

                            <div class="w-14 h-8 bg-gray-300 rounded-full peer-checked:bg-green-500 after:absolute after:left-1 after:top-1 after:bg-white after:h-6 after:w-6 after:rounded-full after:transition-all peer-checked:after:translate-x-6 ">

                            </div>

                        </label>

                    </div>
                    
                    <div class="text-gray-400 text-sm mt-3">

                        <p>
                            Ligado → imprime senha
                        </p>

                        <p>
                            Desligado → impressão direta
                        </p>

                    </div>
                </div>

            </div>

            <div class="bg-white rounded-2xl shadow p-5 mt-5">
                    <div class="flex justify-between items-center">
                        <div>
                            <span>
                                *habilitar seleção de login ou nao
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow p-5 mt-5 mb-10">

                <h2 class="text-lg font-semibold text-slate-700">
                    Tema do aplicativo
                </h2>

                <p class="text-sm text-slate-500 mb-5">
                    Escolha a cor principal do sistema.
                </p>

                <div class="flex gap-4 flex-wrap">

                    <button class="theme w-12 h-12 rounded-full bg-blue-500" data-color="blue"></button>

                    <button class="theme w-12 h-12 rounded-full bg-green-500" data-color="green"></button>

                    <button class="theme w-12 h-12 rounded-full bg-red-500" data-color="red"></button>

                    <button class="theme w-12 h-12 rounded-full bg-purple-500" data-color="purple"></button>

                    <button class="theme w-12 h-12 rounded-full bg-orange-500" data-color="orange"></button>

                    <button class="theme w-12 h-12 rounded-full bg-orange-950" data-color="brown"></button>

                    <button class="theme w-12 h-12 rounded-full bg-pink-500" data-color="pink"></button>

                    <button class="theme w-12 h-12 rounded-full bg-cyan-500" data-color="cyan"></button>

                    <button class="theme w-12 h-12 rounded-full bg-indigo-500" data-color="indigo"></button>

                    <button class="theme w-12 h-12 rounded-full bg-amber-500" data-color="amber"></button>

                    <button class="theme w-12 h-12 rounded-full bg-emerald-500" data-color="emerald"></button>

                    <button class="theme w-12 h-12 rounded-full bg-slate-700" data-color="slate"></button>

                    <button class="theme w-12 h-12 rounded-full bg-black" data-color="black"></button>

                </div>

            </div>

        </div>


        

    </main>

    <script type="module" src="./js/pages/config.page.js"></script>

</body>

</html>
