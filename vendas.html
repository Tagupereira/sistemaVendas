<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport" />
    <meta name="theme-color" content="#3b82f6">
    <title>Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body class="bg-slate-50">
   
    <!-- HEADER -->
    <header class="relative h-20 mb-10 overflow-hidden">

        <svg viewBox="0 0 10 100" preserveAspectRatio="none" class="absolute inset-0 w-full h-full">

            <path id="temaTopo" d="M0,0 L500,0 L500,130 C350,220 150,40 0,130 Z"></path>

        </svg>

        <div class="relative z-10 px-6 pt-6 flex items-center gap-4">

            <span id="btnMenu" class="material-symbols-outlined text-3xl">menu </span>

            <h1 id="tituloPage" class="text-2xl font-semibold text-white">Vendas</h1>

            <div id="indResp" class="w-[15px] h-[15px] bg-blue-300 rounded-full ml-auto"></div>
        </div>

    </header>

    <main class="px-5 -mt-4 pb-10">
               
        <!-- BUSCA -->

        <div class="bg-white rounded-3xl shadow p-5 ">

            <input id="buscarVenda" type="text" placeholder="Buscar pedido ou cliente..."
            class="w-full border-b-2 border-slate-200 py-3 outline-none focus:border-blue-500">

        </div>

        <!-- LISTA -->

        <div id="listaVendas" class="space-y-3 mt-5">

            <!-- CARDS INSERIDOS VIA JS -->

            <div id="listaVendas" class="space-y-6">
                                
            </div>

        </div>

    </main>
    <div id="menu"></div>
     

    <!-- MODAL DETALHES VENDA -->



<!-- MODAL COMPROVANTE DA VENDA -->

<div id="modalVenda" class="fixed inset-0 bg-slate-100 hidden z-50 overflow-y-auto">

    <!-- Topo -->
    <div id="topoComprovante" class="h-32 px-5 pt-5 flex justify-between items-start">
        <h2 id="tituloComprovante" class="text-2xl font-semibold mt-2">Comprovante</h2>
        <button id="fecharModalVenda" aria-label="Fechar" class="w-11 h-11 rounded-full bg-white text-slate-700 flex items-center justify-center shadow">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <!-- Cartão -->
    <section class="relative -mt-14 mx-4 mb-32 bg-white rounded-3xl shadow-lg p-5">

        <p id="nomeCupom" class="text-center font-extrabold tracking-widest"></p>

        <div class="text-center mt-3">
            <span id="statusVenda" class="inline-block rounded-full px-3 py-1 text-xs font-bold"></span>
        </div>

        <h3 id="modalPedido" class="text-center text-2xl font-extrabold mt-3">Pedido #0000</h3>
        <p id="modalData" class="text-center text-xs text-slate-600 font-mono mt-1"></p>
        <p id="modalCliente" class="text-center mt-2"></p>

        <div class="relative -mx-5 my-4 border-t-2 border-dashed border-slate-300">
            <i class="absolute -left-3 -top-3 w-6 h-6 rounded-full bg-slate-100"></i>
            <i class="absolute -right-3 -top-3 w-6 h-6 rounded-full bg-slate-100"></i>
        </div>

        <div id="modalItens" class="space-y-2"></div>

        <div class="relative -mx-5 my-4 border-t-2 border-dashed border-slate-300">
            <i class="absolute -left-3 -top-3 w-6 h-6 rounded-full bg-slate-100"></i>
            <i class="absolute -right-3 -top-3 w-6 h-6 rounded-full bg-slate-100"></i>
        </div>

        <div class="flex justify-between items-baseline">
            <span class="text-sm font-bold tracking-widest text-slate-600">TOTAL</span>
            <span id="modalTotal" class="text-3xl font-bold font-mono">R$ 0,00</span>
        </div>

        <p class="mt-4 mb-2 text-xs font-bold tracking-widest text-slate-600">PAGAMENTOS</p>
        <div id="modalPagamentos" class="space-y-1"></div>

        <div id="totalPedido" class="mt-3 space-y-1 text-sm"></div>

        <div id="obsBox" class="hidden mt-3 bg-slate-100 rounded-xl px-3 py-2 text-sm">
            <b>Observação:</b> <span id="obs"></span>
        </div>

        <p class="text-center text-xs text-slate-600 mt-4">Cupom não fiscal · Obrigado pela preferência!</p>

    </section>

    <!-- Ações fixas -->
    <div class="fixed bottom-0 inset-x-0 bg-white border-t px-4 pt-3 pb-4 flex gap-3">
        <button id="btnCompartilharVenda" class="flex-[1.4] h-[52px] rounded-2xl bg-green-700 text-white font-bold flex items-center justify-center gap-2">
            <span class="material-symbols-outlined">share</span>Compartilhar
        </button>
        <button id="btnImprimirVenda" class="flex-1 h-[52px] rounded-2xl bg-slate-900 text-white font-bold flex items-center justify-center gap-2">
            <span class="material-symbols-outlined">print</span>Imprimir
        </button>
        <button id="btnMaisVenda" aria-label="Mais ações" class="w-[52px] h-[52px] rounded-2xl bg-slate-200 text-slate-900 flex items-center justify-center">
            <span class="material-symbols-outlined">more_horiz</span>
        </button>
    </div>

    <!-- Menu "mais ações" -->
    <div id="menuMaisVenda" class="hidden fixed inset-0 bg-black/40 z-[60] flex items-end">
        <div class="bg-white w-full rounded-t-3xl p-4 pb-6">
            <button id="btnExcluirVenda" class="w-full h-[52px] rounded-2xl bg-red-50 text-red-700 font-bold">Excluir venda</button>
            <button id="btnFecharMais" class="w-full h-[52px] rounded-2xl bg-slate-100 text-slate-700 font-bold mt-2">Cancelar</button>
        </div>
    </div>

</div>





    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center">

        <div class="bg-white p-6 rounded-2xl shadow-lg flex items-center gap-3">

            <div class="w-6 h-6 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>

            <span>Aguarde Excluindo venda...</span>

        </div>

    </div>
    

    <script type="module" src="../js/pages/vendas.page.js"></script>
</body>

</html>
